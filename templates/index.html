<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Plate Recognition</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://kit.fontawesome.com/d4287010a5.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav class="container glass">
            <div class="logo">LPR System</div>
            <div class="nav-links">
                <a href="#contact">Contact</a>
                <a href="{{ url_for('images') }}" class="primary">View Detected Plates</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="main-content">
            <div class="video-container glass fade-in-up">
                <img src="{{ url_for('video_feed') }}" alt="Video Feed">
            </div>
            <div class="side-panel">
                <div class="plate-info glass fade-in-up" id="plate-info">
                    <h2>Statusi i targës</h2>
                    <p class="not-detected pulse">Targa nuk u zbulua</p>
                    <p class="plate-number" style="display:none;"></p>
                    <p class="time-stamp" style="display:none;"></p>
                </div>
                <div class="controls glass fade-in-up">
                    <a href="{{ url_for('images') }}" class="primary">Shikoni Imazhet e zbuluara</a>
                    <button id="start-btn" disabled><i class="fas fa-video"></i> Kamera nis automatikisht</button>
                </div>
                <div class="stats glass fade-in-up">
                    <h2>Statistikat e Sistemit</h2>
                    <div class="stats-grid">
                        <div class="stat-item pulse">
                            <h3>Zbulimet totale</h3>
                            <p id="total-detections">Po ngarkohet...</p>
                        </div>
                        <div class="stat-item pulse">
                            <h3>Targat unike</h3>
                            <p id="unique-plates">Po ngarkohet...</p>
                        </div>
                        <div class="stat-item">
                            <h3>Top 5 targat</h3>
                            <div id="top-plates">Po ngarkohet...</div>
                        </div>
                        <div class="stat-item">
                            <h3>Shpërndarja për orë</h3>
                            <div id="hour-distribution">Po ngarkohet...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
